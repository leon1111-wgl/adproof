name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Span-level eval gate (offline model, synthetic data)
        run: python -m app.evals.cli --gate 0.80 --rewrite-gate 0.90 --report eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report.json

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t adproof:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name adproof -p 8000:8000 adproof:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep '"status":"ok"'
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
