# AdProof 评测集（SYNTHETIC：脚本、品牌、商品全部虚构）
#
# 标注写在原文里：[[分类|违规片段]]，加载时去掉标记并换算成字符起止位置。
# 标注口径（docs/EVALUATION.md 有完整说明）：
# - 显性违规只标最小违规表述，例如“最好用”“全网最低价”“消炎”“98%的姐妹”；
#   紧挨着的比较范围词（全网 / 史上 / 行业 / 同类）算在片段内。
# - 隐含违规标承载这层意思的最短分句片段，例如“喝了一个月血糖都稳了”。
# - fact_mismatch 只标与商品资料不一致的“数字 + 单位”，例如“30%”“99元”。
# - missing_disclosures 记录脚本缺少的必要声明（文档级，不计入片段指标）。
#
# 划分：dev 用来调试规则；test 写完后不再据此改规则，只用于报告。
# 两部分由同一作者编写，独立性有限，这一点在 README 和评测文档里都有说明。

