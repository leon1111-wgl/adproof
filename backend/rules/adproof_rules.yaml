# AdProof 规则库（可在控制台「规则库 → YAML 编辑」中修改，保存前会自动校验）
#
# 约定
# - 正则运行在“归一化文本”上：全角转半角、英文转小写、去掉空白和夹在汉字之间的装饰符号。
#   宏：{NB} = 一个非断句字符，{B} = 一个断句符号（逗号、句号、问号、感叹号、分号、换行）。
# - law_refs 只能引用 backend/laws/ 中已核对的条款；引用不到时该依据会显示为“待核对”。
#   when 表示仅对这些商品类目生效（例如保健食品额外适用第十八条）。
# - references 用于还没有纳入本地快照的文件，一律标注 status: pending（待核对），不摘录正文。
# - examples.hit / examples.pass 是规则自带的正反例，测试和保存时都会运行。

version: "2026.11.10"
name: 广告合规基础规则库
description: 面向短视频与直播带货脚本的广告法基础规则。演示用途，不构成法律意见。

product_categories:
  general: 通用
  cosmetics: 美妆个护
  food: 普通食品
  health_food: 保健食品
  digital: 数码家电
  home: 家居日用
  apparel: 服饰鞋包
  franchise: 招商加盟
  education: 课程培训

categories:
  - id: absolute_terms
    label: 绝对化用语
    description: 最高级、排名第一、“天花板”等无法证明的极限表述。
    severity: high
    priority: 70
    law_refs:
      - {law: advertising_law, article: 9, paragraph: 1, item: 3}
    penalty_refs:
      - {law: advertising_law, article: 57, paragraph: 1, item: 1}
    references:
      - title: 广告绝对化用语执法指南
        issuer: 国家市场监督管理总局
        status: pending
        note: 尚未纳入本地法条快照，原文与适用口径待人工核对，暂不摘录任何条文。
    rewrite: {strategy: delete_clause, note: 删除无法证明的极限表述，改为可核实的具体事实。}

  - id: authority_endorsement
    label: 国家机关名义
    description: 使用或者变相使用国家机关、国家机关工作人员的名义或形象背书。
    severity: high
    priority: 80
    law_refs:
      - {law: advertising_law, article: 9, paragraph: 1, item: 2}
    penalty_refs:
      - {law: advertising_law, article: 57, paragraph: 1, item: 1}
    rewrite: {strategy: delete_clause, note: 删除国家机关背书类表述。}

  - id: medical_claims
    label: 疾病治疗与医疗用语
    description: 非医疗类商品宣称疾病治疗功能、使用医疗用语或与药品混淆。
    severity: high
    priority: 90
    law_refs:
      - {law: advertising_law, article: 17, paragraph: 1}
      - {law: advertising_law, article: 18, paragraph: 1, item: 2, when: [health_food]}
      - {law: food_safety_law, article: 73, paragraph: 1, when: [food, health_food]}
      - {law: cosmetics_regulation, article: 43, paragraph: 2, when: [cosmetics]}
    penalty_refs:
      - {law: advertising_law, article: 58, paragraph: 1, item: 2}
    rewrite: {strategy: delete_clause, note: 删除疾病治疗或医疗相关表述，只描述正常使用体验。}

  - id: effect_claims
    label: 效果保证与虚构效果
    description: 对使用效果作出保证，或给出无法证明的量化效果。
    severity: high
    priority: 60
    law_refs:
      - {law: advertising_law, article: 4, paragraph: 1}
      - {law: advertising_law, article: 28, paragraph: 2, item: 4}
      - {law: advertising_law, article: 18, paragraph: 1, item: 1, when: [health_food]}
    penalty_refs:
      - {law: advertising_law, article: 55, paragraph: 1}
    rewrite: {strategy: delete_clause, note: 删除效果保证；如有真实测试数据，注明测试条件与出处。}

  - id: unsourced_data
    label: 数据无出处
    description: 使用数据、调查结果、实验结论作证明，但没有标明出处。
    severity: medium
    priority: 50
    law_refs:
      - {law: advertising_law, article: 11, paragraph: 2}
      - {law: advertising_law, article: 28, paragraph: 2, item: 3}
    penalty_refs:
      - {law: advertising_law, article: 59, paragraph: 1, item: 2}
    rewrite: {strategy: delete_clause, note: 补充数据出处、统计口径和时间，或删除该数据。}

  - id: disparagement
    label: 贬低其他经营者
    description: 贬低其他生产经营者的商品或者服务。
    severity: medium
    priority: 40
    law_refs:
      - {law: advertising_law, article: 13, paragraph: 1}
    penalty_refs:
      - {law: advertising_law, article: 59, paragraph: 1, item: 4}
    rewrite: {strategy: delete_clause, note: 删除针对其他经营者的贬低，只讲自家商品的事实。}

  - id: guaranteed_returns
    label: 收益或结果保证
    description: 招商加盟承诺收益、保本，或教育培训承诺通过、就业、变现等结果。
    severity: high
    priority: 85
    law_refs:
      - {law: advertising_law, article: 25, paragraph: 1, item: 1, when: [franchise]}
      - {law: advertising_law, article: 24, paragraph: 1, item: 1, when: [education]}
    penalty_refs:
      - {law: advertising_law, article: 58, paragraph: 1, item: 7, when: [franchise]}
      - {law: advertising_law, article: 58, paragraph: 1, item: 6, when: [education]}
    rewrite: {strategy: replace, fallback: 实际效果因人而异, note: 删除保证性承诺，并提示风险与个体差异。}

  - id: endorsement
    label: 专业人士或代言人推荐
    description: 保健食品利用代言人作推荐、证明；教育培训利用学术、教育机构或专业人士的名义作推荐、证明。
    severity: high
    priority: 55
    law_refs:
      - {law: advertising_law, article: 18, paragraph: 1, item: 5, when: [health_food]}
      - {law: advertising_law, article: 24, paragraph: 1, item: 3, when: [education]}
    penalty_refs:
      - {law: advertising_law, article: 58, paragraph: 1, item: 3, when: [health_food]}
      - {law: advertising_law, article: 58, paragraph: 1, item: 6, when: [education]}
    rewrite: {strategy: delete_clause, note: 删除专业人士或机构的推荐、证明，只介绍商品或课程本身。}

  - id: patent_claims
    label: 专利宣称
    description: 宣称专利产品、专利技术或专利配方，但没有标明专利号和专利种类。
    severity: medium
    priority: 45
    law_refs:
      - {law: advertising_law, article: 12, paragraph: 1}
    penalty_refs:
      - {law: advertising_law, article: 59, paragraph: 1, item: 3}
    rewrite: {strategy: delete_clause, note: 补充专利号和专利种类（如“发明专利 ZL…”）；无法提供时删除专利表述。}

  - id: fact_mismatch
    label: 与商品资料不符
    description: 脚本中的价格、成分、规格等数字与商品资料不一致。
    severity: high
    priority: 95
    law_refs:
      - {law: advertising_law, article: 28, paragraph: 2, item: 2}
      - {law: advertising_law, article: 8, paragraph: 1}
    penalty_refs:
      - {law: advertising_law, article: 55, paragraph: 1}
    rewrite: {strategy: replace, note: 按商品资料改正数字。}

rules:
  # ------------------------------------------------------------------ 绝对化用语
  - id: ABS-01
    name: “最”字最高级
    category: absolute_terms
    patterns:
      - '(?:全网|全国|全球|国内|史上|行业|业内|同类|同价位|全场|本店|市面上)?(?:最|zui)(?:佳|好用|好吃|好喝|好(?=的|了|[,。!?;\n~]|$)|优|强|棒|牛|高级|先进|便宜|划算|实惠|超值|值得|畅销|热销|火爆|受欢迎|安全|有效|管用|专业|正宗|权威|纯正|天然|舒服|舒适|耐用|靠谱|保湿|美白|显白|持久|轻薄|清爽|温和|好看)'
    exceptions:
      - '最好(?:在|先|不要|别|还是|搭配|配合|提前|每天|坚持|放|冷藏|随身|带上?|早|晚|睡前|饭前|饭后|空腹|避光|摇匀|及时|定期|尽快|咨询|遵医嘱|分次|少量|多喝|多用|试用|先试)'
      - '(?:左右|以上|以下|的时候|时候|之后|之前|冷藏后|冰镇后|加热后|泡开后|晾凉后)[^,。!?;\n]{0,4}最好(?=[,。!?;\n]|$)'
      - '(?:这样|这么|晚上|早上|睡前|饭后|饭前|空腹|有时间|提前|冷藏|冰镇|摇匀)[^。!?;\n]{0,10}?(?:效果|效率|口感|吸收|味道)最好(?=[,。!?;\n~]|$)'
    negation: true
    reason: 使用“最佳”“最好”等最高级用语，属于第九条第三项列举的绝对化用语。
    rewrite:
      strategy: prefix
      prefix_from: 最
      prefix_to: 很
      replacements: {最佳: 出色, 最好: 很好}
    examples:
      hit: [这是我用过最好用的精华, 全场最划算的一单, 家人们这是zui好用的一款, 这是市面上最好的精华, 效果全网最好]
      pass: [最近换季皮肤有点干, 最好在晚上洁面后使用, 我们不说最好，只说合适, 夏天最好随身带一支补涂, 最好每两小时补涂一次, 冲泡水温八十度左右口感最好, 冰镇后喝口感最好, 益生菌最好晚上喝效果最好, 建议晚上有时间再学，效率最好, 最好每天一片，这样效果最好]

  - id: ABS-02
    name: 最低价等价格极限词
    category: absolute_terms
    patterns:
      - '(?:全网|全国|全平台|全渠道|史上|历史|今年|年度|行业)最低(?:价格|价|折扣)?'
      - '最低(?:价格|价|折扣)'
      - '全网(?:最)?便宜'
    exceptions:
      - '最低(?:只要|仅需|可至|至|消费|温度|配置|档|要求|标准)'
    reason: “全网最低价”“史上最低”等价格极限词无法证明，属于绝对化用语。
    rewrite:
      strategy: replace
      replacements: {全网最低价: 直播间活动价, 史上最低价: 本场活动价, 最低价: 活动价, 全网最便宜: 很实惠, 全网便宜: 很实惠}
      fallback: 活动价
    examples:
      hit: [今天直播间全网最低价, 这个价格是史上最低]
      pass: [券后最低只要59元, 最低温度零下5度]

  - id: ABS-03
    name: 第一、NO.1 等排名用语
    category: absolute_terms
    patterns:
      - '(?:全国|全网|全球|国内|行业|同类)?(?:销量|排名|行业|全网|全国|全球|品类|同类|领域|国内|口碑|好评|人气)(?:排名)?(?:第一|冠军)'
      - '第一(?:品牌|名|大牌)'
      - 'no\.?1|top\.?1'
      - '(?:全网|行业|全国|全球|国内)首(?:个|家|款|创|发)'
      - '首创'
      - '排(?:名)?第一(?!个|次|步|天|位|批)|稳居第一|稳坐第一'
      - '没得比|无可比拟|没有对手|没对手|无人能及|无出其右|没人比得上'
    exceptions:
      - '第一(?:次|步|天|时间|批|个月|周|口|眼|件|单|位)'
    reason: “销量第一”“NO.1”“首创”等排名或首位表述无法证明，属于绝对化用语。
    rewrite:
      strategy: replace
      replacements: {销量第一: 销量不错, 销量冠军: 热销, 排名第一: 很受欢迎, 第一品牌: 知名品牌, 第一名: 热门款, no.1: 人气款, top1: 人气款, 首创: 采用, 行业首创: 采用}
    examples:
      hit: [这款是同类销量第一, NO.1 爆款面霜, 行业首创的配方, 全国销量冠军, 我试了无数款它都没得比, 快充没对手, 这款绝对排第一]
      pass: [第一次用就爱上了, 第一步先洁面, 排第一个的家人先拍]

  - id: ABS-04
    name: 顶级、天花板等极限词
    category: absolute_terms
    keywords: [顶级, 顶尖, 极品, 极致, 至尊, 巅峰, 王牌, 销冠, 断货王, 行业领先, 无敌, 绝无仅有, 史无前例, 万能, 天花板, 封神, 遥遥领先, 没有之一, 首选, yyds, 永远的神]
    reason: “顶级”“天花板”等极限词无法证明，属于绝对化用语。
    rewrite:
      strategy: replace
      replacements: {没有之一: '', yyds: 很好用, 永远的神: 很好用, 史无前例: 难得, 绝无仅有: 少见, 首选: 常选, 天花板: 口碑款, 顶级: 优质, 顶尖: 优质, 极品: 优质, 极致: 出色, 至尊: 高端, 巅峰: 出色, 王牌: 主推, 销冠: 热销款, 断货王: 热销款, 行业领先: 表现不错, 无敌: 很, 万能: 多用途, 封神: 口碑好, 遥遥领先: 表现不错}
    examples:
      hit: [国货天花板级别的面霜, 顶级的原料, 全网断货王, 吸力行业领先]
      pass: [顶部按压设计, 极为细腻的质地]

  - id: ABS-05
    name: 国家级、世界级用语
    category: absolute_terms
    patterns:
      - '国家级|世界级|全球级|宇宙级|最高级|最高等级'
    exceptions:
      - '国家级(?:非物质文化遗产|非遗)'
    reason: 法条直接列举了“国家级”“最高级”，“世界级”等同类表述同样无法证明。
    rewrite:
      strategy: replace
      replacements: {国家级: 专业, 世界级: 专业, 全球级: 专业, 宇宙级: 专业, 最高级: 高品质, 最高等级: 高品质}
    examples:
      hit: [国家级配方, 世界级工艺]
      pass: [国家级非遗手工技艺]

  - id: ABS-06
    name: 范围词加“最”
    category: absolute_terms
    patterns:
      - '(?:全宇宙|全世界|全行业|行业内|史上|全球|全国|全网|世界|宇宙|行业|业内|国内)最(?!低|近|新款)[一-鿿](?:(?!的)[一-鿿])?'
    reason: “史上最”“全网最”加任何形容词都是无法证明的最高级。
    rewrite: {strategy: prefix, prefix_from: 最, prefix_to: 很}
    examples:
      hit: [这件羽绒服是史上最保暖的, 全网最柔软, 这是全宇宙最强的蓝牙耳机]
      pass: [最近换季皮肤有点干, 我最喜欢这个颜色]

  - id: ABS-07
    name: 唯一
    category: absolute_terms
    patterns:
      - '(?:全宇宙|全世界|全行业|行业内|全球|全国|全网|世界|行业|国内|业内|史上|同类|市面上)(?:唯一|独一无二)'
    reason: “全球唯一”“行业唯一”无法证明，属于绝对化用语。
    rewrite: {strategy: replace, fallback: '', note: 删除“唯一”类表述。}
    examples:
      hit: [全球唯一一款支持这个功能的手机, 行业内独一无二的降噪技术]
      pass: [唯一的缺点是有点贵]

  # ------------------------------------------------------------------ 国家机关名义
  - id: AUT-01
    name: 国家机关背书与特供
    category: authority_endorsement
    patterns:
      - '(?:国家|政府|部委|国务院|卫健委|卫健部门|卫生健康部门|健康部门|卫生部门|疾控中心|疾控|药监局|市场监管局|监管部门|政府部门|海关|机关单位|部队)(?:指定|推荐|认证|专供|特供|特选|特批|点名|监制|背书|采购)'
      - '上面(?:的)?(?:(?:部门|领导|单位)(?:特别|专门|严格|亲自)?|特别|专门|严格|亲自)(?:审批|批准|特批|点名|指定|认可|推荐)|(?:政府|上面|国家)特批'
      - '(?:人民大会堂|国宴|机关)(?:专用|专供|特供|指定|御用)'
      - '特供'
    exceptions:
      - '(?:电商|线上|直播间|渠道|门店|会员|粉丝)特供'
      - '国家推荐(?:标准|性标准)'
    reason: 使用或者变相使用国家机关名义背书，属于第九条第二项的禁止情形。
    examples:
      hit: [这款茶是国宴特供, 政府指定合作品牌, 还是卫健部门推荐的, 经过上面严格审批的, 是上面部门特别审批的, 听说是健康部门特选的]
      pass: [粉丝特供福利价, 符合国家推荐标准, 包装上面批准文号写得很清楚]

  # ------------------------------------------------------------------ 疾病治疗与医疗用语
  - id: MED-01
    name: 疾病治疗功能
    category: medical_claims
    patterns:
      - '治疗|治愈|根治|疗效|药到病除|包治|祛病|消炎|抗炎|止痛|镇痛|止痒'
      - '降(?:血压|血糖|血脂|三高|尿酸)|软化血管|清理血管'
      - '(?:防|抗|治)癌|抗肿瘤|抗病毒|活血化瘀|清热解毒|排毒养颜'
      - '调理(?:脾胃|肠胃|气血|内分泌)'
      - '调理{NB}{0,4}?(?:炎|病|症)'
    negation: true
    reason: 非医疗类商品宣称疾病治疗功能。
    rewrite:
      strategy: replace
      replacements: {消炎: 舒缓, 抗炎: 舒缓, 止痒: 舒缓, 止痛: 舒缓, 镇痛: 舒缓}
    examples:
      hit: [喝一个月能降血糖, 这款精华还能消炎祛痘, 可以调理慢性肠炎]
      pass: [本品不能治疗疾病, 皮肤科医生建议做好防晒]

  - id: MED-02
    name: 医疗用语
    category: medical_claims
    patterns:
      - '处方|药方|秘方|偏方|古方|医用级|医学级|药用级|药妆|医生推荐|专家推荐|医院同款|医院专用|疗程|药效'
      - '(?:医生|大夫|药师|专家)(?:都|也)(?:推荐|力荐)'
      - '(?:三甲)?医院(?:都在用|都在卖|里都用|指定|专用|同款|推荐)'
      - '临床(?:验证|试验|实验|证明|测试)'
      - '(?:无|零|没有)副作用'
    negation: true
    reason: 使用医疗用语，容易使商品与药品、医疗器械混淆。
    rewrite:
      strategy: replace
      replacements: {医用级: 温和配方, 医学级: 温和配方, 药妆: 护肤品, 疗程: 周期}
    examples:
      hit: [医用级的修护面膜, 坚持三个疗程, 临床验证有效, 医生都推荐我吃, 三甲医院都在用]
      pass: [适合日常护肤, 医院旁边就有我们的线下店]

  - id: MED-03
    name: 与药品比较或替代药物
    category: medical_claims
    patterns:
      - '(?:比|胜过|堪比|媲美|相当于|顶得上|不输)(?:吃)?(?:药|药物|药品)'
      - '(?:代替|替代|取代)(?:吃药|药物|药品|药)'
      - '不用(?:再)?吃药'
      - '不用(?:再)?吃{NB}{0,4}?药|(?:可以|就能|就可以)停(?:掉)?{NB}{0,4}?药'
      - '(?:比|胜过)(?:去医院|看医生|打针|做手术)(?:还|更)?(?:管用|有效|好使|灵|强)|(?:堪比|媲美|顶得上|相当于)(?:去医院|看医生|打针|做手术)'
    negation: true
    reason: 与药品进行比较或暗示可以替代药物，容易使商品与药品混淆。
    law_refs:
      - {law: advertising_law, article: 18, paragraph: 1, item: 4, when: [health_food]}
    examples:
      hit: [喝它比吃药还管用, 以后不用再吃药了, 吃了它就不用吃降压药了, 用了比去医院还管用]
      pass: [本品不能代替药物, 周末来门店比去医院排队省事, 吃药期间请咨询医生]

  - id: MED-04
    name: 疾病预防与治愈表述
    category: medical_claims
    patterns:
      - '(?:预防|防止|远离|告别|再也不|不再)(?:得)?(?:感冒|流感|失眠|便秘|过敏|三高|高血压|糖尿病|骨质疏松|贫血|近视|脱发)'
      - '预防{NB}{0,6}?(?:疾病|病)|改善(?:失眠|便秘|湿疹|鼻炎|胃病|三高|高血压|糖尿病|脂肪肝|咽炎|脱发)'
      - '(?:颈椎病|腰椎病|关节炎|失眠|便秘|湿疹|鼻炎|胃病|高血压|糖尿病|痛风|脂肪肝|咽炎|脱发|三高)(?:都|也|全)?(?:好了|治好了|没了|消失了|痊愈了?|不犯了|一去不复返|再也不犯了?|全没了)'
    reason: 宣称预防或治愈具体疾病。
    examples:
      hit: [换季再也不感冒, 用了以后颈椎病都好了, 预防心脑血管疾病, 睡一晚就能改善失眠]
      pass: [换季注意保暖, 预防晒伤要提前涂]

  - id: MED-05
    name: 针对具体疾病的宣称
    category: medical_claims
    patterns:
      - '(?:预防|防治|治疗|治好|治愈|根治|缓解|改善|调理|对付|远离|告别|淡化|祛除|消除|抵抗|抗)[^,。!?;\n]{0,4}?(?:糖尿病|高血压|高血脂|高血糖|冠心病|心脏病|心脑血管(?:疾病|病)?|脑梗|中风|痛风|关节炎|风湿|骨质疏松|颈椎病|腰椎间盘突出|腰椎病|失眠|抑郁症?|焦虑症|便秘|腹泻|肠炎|胃炎|胃溃疡|幽门螺杆菌|肝病|脂肪肝|肾病|湿疹|皮炎|银屑病|牛皮癣|白癜风|黄褐斑|痤疮|鼻炎|咽炎|哮喘|感冒|流感|新冠|肺炎|癌症?|肿瘤|结节|囊肿|甲亢|贫血|近视|弱视|脱发|斑秃|前列腺炎?|妇科炎症|宫颈糜烂|乳腺增生|三高|老年痴呆|帕金森)'
      - '(?:糖尿病|高血压|高血脂|高血糖|冠心病|心脏病|心脑血管(?:疾病|病)?|脑梗|中风|痛风|关节炎|风湿|骨质疏松|颈椎病|腰椎间盘突出|腰椎病|失眠|抑郁症?|焦虑症|便秘|腹泻|肠炎|胃炎|胃溃疡|幽门螺杆菌|肝病|脂肪肝|肾病|湿疹|皮炎|银屑病|牛皮癣|白癜风|黄褐斑|痤疮|鼻炎|咽炎|哮喘|感冒|流感|新冠|肺炎|癌症?|肿瘤|结节|囊肿|甲亢|贫血|近视|弱视|脱发|斑秃|前列腺炎?|妇科炎症|宫颈糜烂|乳腺增生|三高|老年痴呆|帕金森)(?:病人|患者|人群|的人|朋友|人)?(?:(?:也|都)?(?:能|可以)(?:放心)?|(?:也|都)?放心)(?:吃|喝|用)'
      - '(?:糖尿病|高血压|高血脂|高血糖|冠心病|心脏病|心脑血管(?:疾病|病)?|脑梗|中风|痛风|关节炎|风湿|骨质疏松|颈椎病|腰椎间盘突出|腰椎病|失眠|抑郁症?|焦虑症|便秘|腹泻|肠炎|胃炎|胃溃疡|幽门螺杆菌|肝病|脂肪肝|肾病|湿疹|皮炎|银屑病|牛皮癣|白癜风|黄褐斑|痤疮|鼻炎|咽炎|哮喘|感冒|流感|新冠|肺炎|癌症?|肿瘤|结节|囊肿|甲亢|贫血|近视|弱视|脱发|斑秃|前列腺炎?|妇科炎症|宫颈糜烂|乳腺增生|三高|老年痴呆|帕金森)(?:的)?(?:问题|症状|毛病)?(?:就|都|也)?(?:慢慢|明显|逐渐|很快)?(?:就)?(?:改善|缓解|好转|减轻|稳住|控制住|降下来)'
    negation: true
    reason: 针对具体疾病宣称预防、治疗或适用，属于疾病治疗功能的宣称。
    examples:
      hit: [这个床垫能治疗腰椎间盘突出, 三天淡化黄褐斑, 还能预防新冠, 糖尿病人也能放心喝, 便秘问题改善明显, 三高问题慢慢就稳住了]
      pass: [本品不适合糖尿病人食用, 高血压患者请遵医嘱, 本品不能治疗疾病, 预防晒伤要提前涂, 便秘问题请咨询医生]

  # ------------------------------------------------------------------ 效果保证与虚构效果
  - id: EFF-01
    name: 保证有效
    category: effect_claims
    patterns:
      - '(?:保证|确保|一定|绝对|肯定|百分百|百分之百|100%)(?:能|会|可以)?{NB}{0,4}?(?:有效|见效|管用|变白|美白|瘦|长高|改善|解决|去除|祛除|好转|满意|增强|提高|提升|增加)'
      - '无效(?:包|全额)?退款|不(?:见效|满意)不要钱'
    reason: 对使用效果作出保证，可能构成虚假或引人误解的宣传。
    examples:
      hit: [保证三天见效, 100%有效, 无效全额退款]
      pass: [效果因人而异]

  - id: EFF-02
    name: 量化效果承诺
    category: effect_claims
    patterns:
      - '(?<!\d)\d+(?:天|日|周|个月|次)(?:内|之内)?(?:就|就能|就可以|即可|轻松|快速)?(?:瘦|减|掉|白|变白|美白|焕白|提亮|亮|长高|淡斑|祛斑|祛痘|淡化|年轻|紧致|生发)(?:了)?(?:\d+(?:斤|公斤|kg|cm|厘米|岁|个色号))?'
      - '(?:瘦|减|掉)了?\d+(?:斤|公斤|kg)'
      - '年轻\d+岁'
      - '[一二两三四五六七八九十半]{1,3}(?:天|周|个月|个星期)(?:内|之内)?(?:就|就能|就可以|即可|轻松|快速)?(?:瘦|减|掉|变白|美白|长高|淡斑|祛斑|年轻)(?:了)?(?:[一二两三四五六七八九十]{1,3}|\d+)?(?:斤|公斤|岁)?'
      - '(?:瘦|减|掉)了?[一二两三四五六七八九十]{1,3}(?:斤|公斤)'
      - '(?:喝|吃|用|坚持|练)[^,。!?;\n]{0,6}?(?:肚子|腰围|小肚腩|大腿|双下巴|赘肉|脸)(?:会|就|能|都)?(?:小|瘦|细)了?(?:一圈|两圈|一号|一码)'
    reason: 量化的效果承诺需要真实、可验证的依据，否则可能属于虚构使用商品的效果。
    examples:
      hit: [7天瘦10斤, 28天变白, 一个月掉了15斤, 家人们七天瘦十斤不是梦, 喝个把月肚子会小一圈]
      pass: [建议连续使用28天观察肤感, 三天发货, 一个月用一瓶, 这条裤子腰围小一码，建议拍大一号]

  - id: EFF-03
    name: 立竿见影等夸大表述
    category: effect_claims
    patterns:
      - '永(?:远|久)?不(?:会)?(?:晒黑|晒伤|反弹|过敏|长痘|掉色|变形|发热|起球|脱发|复发)'
    keywords: [立竿见影, 立刻见效, 马上见效, 当天见效, 一次见效, 永不反弹, 一劳永逸, 彻底告别, 根除]
    reason: “立竿见影”“永不反弹”等表述夸大使用效果，容易误导消费者。
    examples:
      hit: [涂上立竿见影, 瘦下来永不反弹, 抹上去永远不会晒黑]
      pass: [坚持使用, 永远不要在阳光下暴晒]

  - id: EFF-04
    name: 问题全部消失
    category: effect_claims
    patterns:
      - '(?:痘痘|痘印|色斑|斑点|皱纹|细纹|黑眼圈|眼袋|妊娠纹|橘皮纹|赘肉|小肚子|水肿|口臭)(?:全|都|统统|通通|一下子|马上|立刻|彻底)(?:消失|不见|没|消)了?'
      - '(?:肠道|肠胃|皮肤|身体|睡眠|头发|口气|体重|血糖|血压)[^,。!?;\n]{0,2}?(?:问题|烦恼)?(?:统统|通通|全部|一次性|彻底|全都)(?:解决|搞定|消失|没了|好了)'
    reason: 宣称问题全部、彻底消失，是对使用效果的保证。
    examples:
      hit: [用了痘痘全消, 肠道问题统统解决]
      pass: [售后问题统统解决, 痘痘肌也能用, 痘印需要坚持护理才会慢慢变淡]

  # ------------------------------------------------------------------ 数据无出处
  - id: DAT-01
    name: 数据与调查结果无出处
    category: unsourced_data
    patterns:
      - '(?<!\d)(?:\d+(?:\.\d+)?%|[六七八九]成)(?:以上)?的?(?:用户|顾客|消费者|宝妈|女生|女性|男性|人|姐妹|买家|回头客|客户|宝子|宝宝|家人|粉丝|老铁|学员)'
      - '(?:回购率|复购率|好评率|满意率|有效率|推荐率|改善率)(?:高达|达到|超过|超|高于)?[六七八九]成'
      - '(?:回购率|复购率|好评率|满意率|有效率|推荐率|改善率)(?:高达|达到|超过|超|高于)?\d+(?:\.\d+)?%'
      - '(?<!\d)\d+(?:\.\d+)?%(?:回购率|复购率|好评率|满意率|有效率|推荐率|改善率)'
      - '(?:研究|实验|调查|测试|权威数据|数据)(?:表明|显示|证明|证实)'
      - '(?:权威|专业|第三方)机构(?:检测|认证|证明)'
      - '销量(?:已经|已)?(?:突破|破|超过|超|过)(?:\d+|[一二两三四五六七八九十百千万]+)(?:万|千|百)?(?:单|件|盒|瓶|份|套)?'
    unless_sentence: '数据来源|来源[:：]|出自|引自|据.{1,20}(?:报告|统计|调查|研究)|报告编号'
    reason: 引用数据、调查或实验结论时没有标明出处。
    rewrite:
      strategy: replace
      subs:
        - {pattern: '^\d+(?:\.\d+)?%的?', replace: 很多}
        - {pattern: '^(?:研究|实验|调查|测试|权威数据|数据)(?:表明|显示|证明|证实)$', replace: 从我们的使用体验看}
    examples:
      hit: [98%的用户都回购了, 回购率高达90%, 实验证明能提亮, 90%的宝子都回购了, 回购率高达九成, 连续三个月销量破万]
      pass: [回购率32%（数据来源：店铺后台2026年9月统计）, 销量破万（数据来源：店铺后台2026年10月统计）]

  - id: DAT-02
    name: 性能提升比例无出处
    category: unsourced_data
    patterns:
      - '(?:续航|效率|吸力|性能|速度|功率|保湿力?|水分|亮度|产量|吸收率?|转化率|含水量|弹性|光泽度?|透气性?|清洁力|信号|网速|音质|画质|清晰度|散热|噪音|能耗|耗电|容量)[^,。!?;\n]{0,4}?(?:(?:提升|提高|增加|增长|增强|降低|减少|快)了?(?:(?<!\d)\d+(?:\.\d+)?(?:%|倍)|[一二两三四五六七八九十]{1,2}(?:成|倍)|一倍)|翻倍|翻了?一番)'
      - '(?:[一-鿿]{1,3}(?<!税)(?<!利)(?<!汇)(?<!费)(?<!折扣)率)(?:高达|达到|超过|达)?(?<!\d)\d+(?:\.\d+)?%'
    unless_sentence: '数据来源|来源[:：]|出自|引自|据.{1,20}(?:报告|统计|调查|研究|测试)|报告编号|实验室测试|以实际为准|以使用环境为准'
    reason: 用百分比或倍数说明性能提升，但没有给出数据出处和测试条件。
    rewrite: {strategy: delete_clause, note: 补充测试条件和数据出处，或删除该数字。}
    examples:
      hit: [续航提升300%, 吸力提高2倍, 信号增强五成, 续航翻倍, 除甲醛率99.9%]
      pass: [价格降低20%, 续航提升30%（数据来源：品牌实验室2026年测试报告）, 增值税率13%, 库存翻倍]

  - id: DAT-03
    name: “快一倍”类倍数说法无出处
    category: unsourced_data
    patterns:
      - '(?:快|强)了?(?:一倍|两倍|三倍|几倍|[一二两三四五六七八九十]+倍|(?<!\d)\d+倍)(?:不止|以上|多)?'
    # a sentence that already says "测试显示" is one unsourced-data finding (DAT-01), not two; once DAT-01's rewrite has
    # reframed it as the shop's own experience (从我们的使用体验看), the multiple is not flagged again
    unless_sentence: '数据来源|来源[:：]|出自|引自|据.{1,20}(?:报告|统计|调查|研究|测试)|报告编号|实验室测试|以实际为准|以使用环境为准|(?:研究|实验|调查|测试|数据)(?:表明|显示|证明|证实)|从我们的使用体验看'
    reason: 用“快一倍”之类的倍数说明效果或性能，但没有给出数据出处和比较条件。
    rewrite: {strategy: delete_clause, note: 补充比较条件和数据出处，或删除该倍数。}
    examples:
      hit: [上手比没学的快一倍不止, 充电比普通充电头快两倍]
      pass: [充电快一倍（数据来源：品牌实验室2026年测试报告）, 测试显示充电速度比普通充电头快一倍]

  # ------------------------------------------------------------------ 贬低其他经营者
  - id: DIS-01
    name: 贬低其他经营者
    category: disparagement
    patterns:
      - '(?:别家|别人家|其他家|其它家|其他品牌|其它品牌|某些品牌|有些品牌|一些品牌|友商|同行|市面上|外面|大牌|竞品|隔壁|那家|别的牌子|其他牌子|他们那些|他们那种|他们那个牌子|那谁家|人家那|某(?!天|日|年|月|次|些|时|刻|处|地|种|个|人|位|一|项)[一-鿿]{1,2})的?{NB}{0,10}?(?:智商税|垃圾|辣鸡|破烂|割韭菜|偷工减料|骗人|劣质|坑人|以次充好|黑心|假货|没法比|比不了|都是坑|噱头|全是添加剂|添加剂一堆|一堆添加剂|有毒|一用就坏|会鼓包|一用就鼓包|差远了|弱爆了|凑数|连[^,。!?;\n]{0,6}都不到)'
      - '(?:吊打|碾压|完爆|秒杀)(?:一切|所有|一众)?(?:同类|大牌|其他|别家|同行|竞品|友商|隔壁|某(?!天|日|年|月|次|些|时|刻|处|地|种|个|人|位|一|项)[一-鿿]{1,2})'
    reason: 贬低其他生产经营者的商品或者服务。
    examples:
      hit: [别家卖的都是智商税, 吊打一众大牌, 某米的充电宝就是垃圾, 拍照效果吊打某星, 跟他们那些添加剂一堆的比, 他们那个牌子的是凑数的, 人家那估计连5%都不到]
      pass: [我们只讲自己的配方, 某天我把垃圾倒了才出门, 比某果的手机便宜一半, 我们家的配料表都写在详情页]

  # ------------------------------------------------------------------ 收益或结果保证
  - id: RET-01
    name: 招商收益保证
    category: guaranteed_returns
    applies_to: [franchise]
    patterns:
      - '稳赚(?:不赔)?|包赚|躺赚|只赚不赔|零风险|无风险|保本|保收益'
      - '(?:保证|确保|包)(?:你|您)?(?:回本|盈利|赚钱|收益)'
      - '保底(?:收入|收益|分红|利润|月入)'
      - '年化(?:收益率?|回报率?)?(?<!\d)\d+(?:\.\d+)?%'
      - '(?:月|年)入(?:过)?(?:\d+|[一二两三四五六七八九十百千]+)?(?:万|千)'
      - '(?<!\d)(?:\d+|[一二两三四五六七八九十半]{1,3})个?(?:月|年)(?:就能|就|即可)?回本了?|当月回本|一年回本'
      - '(?:就能|就可以|就|即可|保证|包)(?:把)?(?:加盟费|本钱|成本|投资|本金)(?:都|全)?(?:赚回来|挣回来|收回来|拿回来)'
    reason: 招商广告对收益作出保证性承诺，或暗示保本、无风险。
    rewrite:
      strategy: replace
      fallback: 收益受选址和经营情况影响，存在亏损风险
    examples:
      hit: [加盟稳赚不赔, 3个月就能回本, 三个月回本, 每月保底收入两万, 很多加盟商半年就回本了, 年化20%, 一年左右就能把加盟费赚回来]
      pass: [加盟有风险，投资需谨慎, 加盟费29800元，一次性缴纳]

  - id: RET-02
    name: 培训结果保证
    category: guaranteed_returns
    applies_to: [education]
    patterns:
      - '(?:保证|包|确保|100%|百分百)(?:你|您)?(?:过|通过|拿证|上岸|提分|涨粉|学会|就业|接单|变现|找到工作|月入)'
      - '(?:考)?不过(?:全额)?(?:退(?:费|款)|免费重(?:修|学|读|考))|重修到过为止'
      - '(?:保证|包|确保)(?:你|您)?(?:考|一次)(?:过|上|通过)|保过|包过(?!来|去)'
      - '学完(?:就能|就可以|即可)(?:月入|接单|变现|赚)'
      - '(?:就能|就可以|就|即可)回本'
      - '(?:就业|找工作|接单|拿证|考证|上岸)(?:都|也)?(?:不成问题|没问题|稳了|稳稳的|妥妥的?)(?![吗嘛吧?])'
      - '(?:接单率|就业率|通过率|过关率|上岸率|拿证率|过考率)(?:至少|高达|达到|超过|有)?(?:[六七八九]成|百分之[一二三四五六七八九十百]+|(?<!\d)\d+(?:\.\d+)?%)'
    reason: 教育培训广告对学习效果作出保证性承诺。
    rewrite:
      strategy: replace
      fallback: 学习效果因人而异
    examples:
      hit: [报名包学会, 不过全额退费, 学完包你找到工作, 保证考过教师资格证, 考不过免费重修到过为止, 学完小半年你就能回本, 跟完我们课就业不成问题, 学完接单率至少九成]
      pass: [课程共32节, 保证每周一次答疑, 考试前要多做真题, 就业没问题吗？可以私信老师]

  # ------------------------------------------------------------------ 专业人士或代言人推荐
  - id: END-01
    name: 专家、医生或名校名义推荐
    category: endorsement
    applies_to: [health_food, education]
    patterns:
      - '(?:老?专家|教授|医生|大夫|主任|博士|院士|营养师|药师|名医|老中医)(?:们)?(?:都|也|亲自)?(?:在吃|在喝|在用|推荐|力荐|认可|说好|代言|作证)'
      - '(?:名校|清华|北大|985|211|名师|教授|博士|学霸|状元|考官)[^,。!?;\n]{0,6}?(?:推荐|力荐|亲自推荐|认证|背书|带你)'
      - '(?:名校|清华|北大|985|211|教授|博士|院士|名师)[^,。!?;\n]{0,8}?(?:都在|也在)(?:学|用|看|听|吃)'
      - '(?:医生|大夫|专家|教授|博士|院士|主任)(?:们)?(?:都|也)?(?:对[^,。!?;\n]{0,8}?)?(?:赞不绝口|竖起?大拇指|连连称赞|夸个不停|都说好)'
    negation: true
    reason: 保健食品不得利用代言人作推荐、证明；教育培训广告不得利用学术、教育机构或专业人士的名义作推荐、证明。
    examples:
      hit: [老专家都在吃, 协和的主任亲自推荐, 名校教授亲自推荐, 清华老师带你上岸, 清华教授都在学这个课, 诊所的李医生都对这门课赞不绝口]
      pass: [请在医生指导下食用, 课程由Leon老师主讲]

  # ------------------------------------------------------------------ 专利宣称
  - id: PAT-01
    name: 专利宣称未标明专利号
    category: patent_claims
    patterns:
      - '(?:国家|独家|多项|多国)?专利(?:[一-鿿]{0,4}?(?:产品|技术|配方|成分|工艺|设计|认证|保护|系统|因子|材料|结构|科技))?'
    unless_sentence: '专利号|zl\d{6,}'
    negation: true
    reason: 广告涉及专利产品或专利方法时应当标明专利号和专利种类，本句没有标明。
    examples:
      hit: [本品采用专利配方, 家人们这是咱家独家专利技术, 含有专利防晒因子]
      pass: [专利号ZL202310123456.7（发明专利）, 我们没有申请专利]

disclosures:
  - id: DSC-01
    name: 保健食品应标明“本品不能代替药物”
    applies_to: [health_food]
    required: 本品不能代替药物
    severity: high
    law_refs:
      - {law: advertising_law, article: 18, paragraph: 2}
      - {law: food_safety_law, article: 79, paragraph: 1}
